<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="音声カルテ">
<title>音声カルテ要約</title>
<style>
  :root { --ink:#1f2933; --sub:#5b6773; --line:#d9dee3; --bg:#f6f7f9; --card:#fff; --acc:#0b6bcb; --acc-ink:#fff; --note-bg:#eef3f8; --note-line:#c9d6e3; --ng:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; font-size:17px; -webkit-text-size-adjust:100%; }
  main { max-width:820px; margin:0 auto; padding:12px 16px 40px; padding-top:max(12px, env(safe-area-inset-top)); }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  h1 { font-size:20px; margin:0; }
  button { font:inherit; color:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line); background:var(--card); padding:10px 16px; min-height:44px; }
  button.main { background:var(--acc); color:var(--acc-ink); border-color:var(--acc); font-weight:700; }
  button:disabled { opacity:.45; cursor:default; }
  .link { border:none; background:none; color:var(--sub); padding:8px; font-size:15px; }
  .mode { display:flex; gap:8px; margin-bottom:10px; }
  .mode button { flex:1; font-size:15px; touch-action:manipulation; }
  .mode button.on { background:var(--acc); color:var(--acc-ink); border-color:var(--acc); font-weight:700; }
  .mode small { display:block; font-size:12px; font-weight:400; }
  textarea { width:100%; font:inherit; font-size:17px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; resize:vertical; line-height:1.6; }
  #input { min-height:32vh; }
  .hint { color:var(--sub); font-size:14px; display:flex; justify-content:space-between; gap:8px; margin:4px 2px 0; }
  .row-btns { display:flex; gap:10px; margin:12px 0; flex-wrap:wrap; }
  .row-btns .main { flex:1; }
  #status { color:var(--sub); font-size:15px; min-height:1.6em; }
  #status.err { color:var(--ng); font-weight:700; }
  .notice { background:var(--note-bg); border:1px solid var(--note-line); border-radius:10px; padding:10px 12px; margin:10px 0; font-size:15px; }
  .notice ul { margin:4px 0 0; padding-left:1.2em; }
  .soap { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card); }
  .sec { display:flex; border-top:1px solid var(--line); }
  .sec:first-child { border-top:none; }
  .sec .k { flex:0 0 40px; background:#eef3f8; font-weight:700; display:flex; justify-content:center; padding-top:12px; }
  .sec .body { flex:1; min-width:0; min-height:3em; padding:12px; white-space:pre-wrap; word-break:break-word; outline:none; line-height:1.6; }
  .sec .body:focus { box-shadow:inset 0 0 0 2px var(--acc); }
  /* 推測して直した言葉:蛍光ペンで塗ったように(暗い画面でも同じ黄色) */
  mark.guess { background:#ffd84a; color:#1f2933; border-radius:4px; padding:0 2px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .legend mark { font-size:14px; }
  .rec-box { margin-bottom:10px; }
  .rec-box .row-btns { margin:0 0 6px; }
  #cancelRec { flex:1; }
  button.rec { flex:2; background:#c0392b; border-color:#c0392b; color:#fff; font-weight:700; }
  button.rec.on { background:#fff; color:#c0392b; animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.6; } }
  .sec .c { flex:0 0 auto; padding:6px; }
  .sec .c button { font-size:14px; padding:6px 10px; min-height:36px; }
  .meta { color:var(--sub); font-size:13px; margin-top:6px; text-align:right; }
  .cost { max-width:320px; margin-left:auto; }
  .cost div { display:flex; justify-content:space-between; gap:14px; }
  .cost .sum { border-top:1px solid var(--line); padding-top:3px; margin-top:3px; font-weight:700; color:var(--ink); }
  .cost .note { justify-content:flex-end; font-size:11px; }
  .usage-line { margin:28px 0 0; padding-top:10px; border-top:1px solid var(--line); color:var(--sub); font-size:13px; text-align:center; }
  .usage-box { margin-top:16px; padding-top:12px; border-top:1px solid var(--line); font-size:15px; }
  .usage-box .cost { max-width:none; margin:6px 0 0; color:var(--sub); }
  #toast { position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:#1f2933; color:#fff; padding:10px 18px; border-radius:20px; font-size:15px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:.92; }
  dialog { border:1px solid var(--line); border-radius:14px; padding:16px; max-width:min(92vw, 480px); width:100%; color:var(--ink); background:var(--card); }
  dialog label { display:block; font-size:15px; margin:10px 0 4px; }
  dialog input { width:100%; font:inherit; font-size:17px; padding:10px; border:1px solid var(--line); border-radius:8px; }
  dialog .muted { color:var(--sub); font-size:13px; }
  [hidden] { display:none !important; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6e9ec; --sub:#9aa5b1; --line:#3a424a; --bg:#15191d; --card:#1f252b; --note-bg:#26303a; --note-line:#3d4b59; --ng:#ff7b6b; }
    .sec .k { background:#26303a; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>音声カルテ要約</h1>
    <button class="link" id="openSettings">⚙ 設定</button>
  </header>

  <div class="mode">
    <button id="modeConv">① 会話を要約<small>押すとすぐ録音</small></button>
    <button id="modeDict" class="on">② 口述を整える<small>2回押すと録音</small></button>
  </div>

  <div id="recBox" class="rec-box" hidden>
    <div class="row-btns">
      <button id="recBtn" class="rec">● 録音を始める</button>
      <button id="cancelRec" hidden>やめる</button>
      <button id="retryBtn" hidden>文字起こしをやり直す</button>
    </div>
    <div id="recStatus" class="hint"></div>
  </div>

  <textarea id="input" placeholder="ここをタップして、キーボードの🎤で話してください(Macは fn キーを2回)。&#10;例:右下6番、3日前から冷たいものがしみる。打診マイナス…"></textarea>
  <div class="hint"><span id="inputHint">聞き間違いはそのままでOK(AIが直します)。患者さんの名前は話さないでください。</span><span id="count">0字</span></div>

  <div class="row-btns">
    <button class="main" id="run">SOAPにまとめる</button>
    <button id="clear">消す</button>
  </div>
  <div id="status" role="status"></div>

  <section id="result" hidden>
    <div class="notice" id="checks" hidden></div>
    <div class="soap">
      <div class="sec"><div class="k">S</div><div class="body" data-k="S"></div><div class="c"><button data-copy="S">コピー</button></div></div>
      <div class="sec"><div class="k">O</div><div class="body" data-k="O"></div><div class="c"><button data-copy="O">コピー</button></div></div>
      <div class="sec"><div class="k">A</div><div class="body" data-k="A"></div><div class="c"><button data-copy="A">コピー</button></div></div>
      <div class="sec"><div class="k">P</div><div class="body" data-k="P"></div><div class="c"><button data-copy="P">コピー</button></div></div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="row-btns">
      <button class="main" id="copyAll">全部コピー</button>
      <button id="again">もう一度まとめる</button>
    </div>
    <div class="hint"><span>貼る前に必ず内容を確認してください。欄の中は直接直せます。</span></div>
  </section>

  <footer class="usage-line" id="usageLine" hidden></footer>
</main>

<dialog id="settings">
  <b>設定</b>
  <label for="pass">合言葉</label>
  <input id="pass" type="password" autocomplete="off">
  <label for="api">中継サーバーのURL</label>
  <input id="api" type="url" placeholder="ふつうは空欄のまま">
  <p class="muted">この端末の中だけに保存します。</p>
  <div class="row-btns"><button class="main" id="saveSettings">保存</button><button id="closeSettings">閉じる</button></div>
  <div class="usage-box">
    <b>使った金額(すべての端末の合計)</b>
    <div id="usageDetail" class="cost"></div>
    <div class="row-btns"><button id="resetUsage">合計をリセット</button></div>
  </div>
</dialog>

<div id="toast"></div>

<script>
const KEYS = ["S", "O", "A", "P"];
// 公開版(GitHub Pages)は Cloudflare の中継サーバーへ、Macの試作はこのページと同じ場所へ
const DEFAULT_API = location.hostname.endsWith("github.io") ? "https://onsei-karte.kinmon-push.workers.dev" : "";
const $ = (id) => document.getElementById(id);
const input = $("input");
const boxes = Object.fromEntries([...document.querySelectorAll(".sec .body")].map((t) => [t.dataset.k, t]));
// 欄は直接直せるようにする(貼り付けで飾りが入らない「文字だけ」の編集を優先)
for (const b of Object.values(boxes)) {
  b.contentEditable = "plaintext-only";
  if (b.contentEditable !== "plaintext-only") b.contentEditable = "true";
}
const esc = (s) => s.replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

// 本文の受け渡しは「〘推測した言葉〙」の印つきの文字で行う。画面では黄色の印、コピーでは印を外す
function setBox(k, marked) {
  boxes[k].innerHTML = esc(marked).replace(/〘([^〘〙\n]*)〙/g, '<mark class="guess">$1</mark>').replace(/[〘〙]/g, "");
}
function getMarked(k) {
  let s = "";
  const walk = (n) => {
    for (const c of n.childNodes) {
      if (c.nodeType === Node.TEXT_NODE) s += c.data;
      else if (c.nodeName === "BR") s += "\n";
      else if (c.nodeName === "MARK") s += "〘" + c.textContent + "〙";
      else { if ((c.nodeName === "DIV" || c.nodeName === "P") && s && !s.endsWith("\n")) s += "\n"; walk(c); }
    }
  };
  walk(boxes[k]);
  return s.replace(/〘〙/g, "");
}
const getPlain = (k) => getMarked(k).replace(/[〘〙]/g, "").trim();

// この端末だけの保存(直前の1件と設定)。使えない環境でも動くようにする
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let settings = store.get("settings") || { pass: "", api: "" };

// 「S:」「O:」「A:」「P:」と、貼らない「確認:」の見出しで分ける
function parseSoap(text) {
  const out = { S: "", O: "", A: "", P: "", 確認: "" };
  let cur = null;
  for (const line of text.split("\n")) {
    const m = line.match(/^\s*([SOAP]|確認)\s*[:：]\s*(.*)$/);
    if (m) { cur = m[1]; if (m[2]) out[cur] += m[2] + "\n"; }
    else if (cur) out[cur] += line + "\n";
  }
  for (const k in out) out[k] = out[k].trim();
  if (!KEYS.some((k) => out[k])) out.S = text.trim(); // 見出しが無いときは全部Sに入れて見せる
  return out;
}

// 貼る前に見る点(コピーには入れない)
let checkItems = [];
function showChecks() {
  const box = $("checks");
  box.hidden = !checkItems.length;
  box.innerHTML = checkItems.length ? `<b>貼る前に確認(${checkItems.length}件・コピーには入りません)</b><ul>${checkItems.map((i) => `<li>${esc(i)}</li>`).join("")}</ul><div class="legend">本文の<mark class="guess">黄色の言葉</mark>は、AIが推測して直したところです(コピーすると色は消えます)。</div>` : "";
}

function showResult(sections, meta) {
  checkItems = (sections.確認 || "").split("\n").map((l) => l.replace(/^\s*[・\-]\s*/, "").trim()).filter((l) => l && l !== "なし");
  for (const k of KEYS) {
    // 古い形(本文に【要確認】)が来たときも、本文からは外して確認欄に回す。
    // 元の言葉「…」が書いてあれば、文が欠けないようにその言葉を黄色の印で残す
    const v = sections[k] || "記載なし";
    for (const m of v.match(/【要確認[^】]*】/g) || []) checkItems.push(`${k} ${m.replace(/^【要確認[:：]?|】$/g, "")}`);
    setBox(k, v.replace(/\s*【要確認[^】]*】/g, (m) => { const w = m.match(/「([^」]+)」/); return w ? ` 〘${w[1]}〙` : ""; }));
  }
  $("result").hidden = false;
  lastMeta = meta || null;
  renderMeta(lastMeta);
  showChecks();
}

// 費用の表示。meta = { stt:文字起こしの円, model, yen:今回のまとめの円, sec, runs:[同じ内容でまとめた各回の円] }
let lastMeta = null;
function renderMeta(m) {
  const el = $("meta");
  if (!m || typeof m === "string") { el.textContent = m || ""; return; } // 古い形で保存された表示
  const yen = (v) => `約${v.toFixed(1)}円`;
  const rows = [];
  if (m.stt) rows.push(["文字起こし(OpenAI)", yen(m.stt)]);
  rows.push([`まとめ(${m.model})`, `${yen(m.yen)}・${m.sec.toFixed(1)}秒`]);
  let html = rows.map(([k, v]) => `<div><span>${esc(k)}</span><span>${v}</span></div>`).join("");
  html += `<div class="sum"><span>合計</span><span>${yen((m.stt || 0) + m.yen)}</span></div>`;
  if (m.runs && m.runs.length > 1) {
    const all = (m.stt || 0) + m.runs.reduce((a, b) => a + b, 0);
    html += `<div><span>もう一度の分を含む合計(まとめ${m.runs.length}回)</span><span>${yen(all)}</span></div>`;
  }
  html += `<div class="note">※1ドル150円で計算した目安</div>`;
  el.innerHTML = `<div class="cost">${html}</div>`;
}

function saveLast() {
  const sections = $("result").hidden ? null : { ...Object.fromEntries(KEYS.map((k) => [k, getMarked(k)])), 確認: checkItems.join("\n") };
  store.set("last", { input: input.value, sections, meta: lastMeta, runs: summaryRuns, runsText, stt: transcribeYen });
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 1500);
}

// 古い方法でのコピー(クリップボードAPIが使えない環境向け)
function copyFallback(text) {
  const t = document.createElement("textarea");
  t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
  const ok = document.execCommand("copy");
  t.remove();
  return ok;
}

// 飾りのない文字だけをコピーする(貼った先に下線や色が付かないように)
async function copy(text, label) {
  let ok = false;
  try {
    await navigator.clipboard.write([new ClipboardItem({ "text/plain": new Blob([text], { type: "text/plain" }) })]);
    ok = true;
  } catch {
    try { await navigator.clipboard.writeText(text); ok = true; } catch { ok = copyFallback(text); }
  }
  toast(ok ? `${label}をコピーしました` : "コピーできませんでした。欄を長押ししてコピーしてください");
}

function setStatus(msg, err) { const s = $("status"); s.textContent = msg; s.classList.toggle("err", !!err); }

let busy = false;
let summaryRuns = [], runsText = "";
async function run() {
  if (recording || sending || queue.length || !lastStopped) { setStatus("文字起こしが終わるまでお待ちください", true); return; }
  const text = input.value.trim();
  if (!text) { setStatus("話した内容がありません", true); return; }
  if (busy) return;
  busy = true; $("run").disabled = true; $("again").disabled = true;
  const t0 = Date.now();
  const tick = setInterval(() => setStatus(`まとめています… ${Math.round((Date.now() - t0) / 1000)}秒`), 500);
  try {
    const res = await fetch((settings.api || DEFAULT_API).replace(/\/$/, "") + "/api/soap", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Passphrase": settings.pass || "" },
      body: JSON.stringify({ mode, text }),
    });
    const data = await res.json().catch(() => ({ error: `サーバーの応答を読めませんでした(${res.status})` }));
    if (!res.ok || data.error) throw new Error(data.error || `エラー(${res.status})`);
    // 同じ内容で「もう一度まとめる」を押した分は足していく。内容が変わったら数え直す
    if (data.usage) renderUsage(data.usage);
    if (runsText !== text) { summaryRuns = []; runsText = text; }
    summaryRuns.push(data.yen);
    const model = "Claude " + String(data.label).replace(/\s*\(.*\)\s*$/, "");
    showResult(parseSoap(data.text), { stt: transcribeYen, model, yen: data.yen, sec: data.sec, runs: summaryRuns.slice() });
    setStatus("できました。内容を確認してからコピーしてください");
    saveLast();
  } catch (e) {
    setStatus(e.message === "Failed to fetch" ? "サーバーにつながりません。通信状態と設定を確認してください" : e.message, true);
  } finally {
    clearInterval(tick); busy = false; $("run").disabled = false; $("again").disabled = false;
  }
}

// ---- 使い方の切り替え(① 会話を要約/② 口述を整える) ----
let mode = store.get("mode") === "conversation" ? "conversation" : "dictation";
const MODE_TEXT = {
  conversation: {
    placeholder: "①を押すと、すぐ録音が始まります。会話は1分ごとに文字になり、ここに入ります(直接直せます)。止めると自動でまとめます。",
    hint: "録音中は画面を閉じたり、ほかのアプリに切り替えたりしないでください。",
  },
  dictation: {
    placeholder: "②を1回押すとキーボードが開くので、🎤で話してください(Macは fn キーを2回)。②を2回続けて押すと、アプリで録音します。\n例:右下6番、3日前から冷たいものがしみる。打診マイナス…",
    hint: "聞き間違いはそのままでOK(AIが直します)。患者さんの名前は話さないでください。",
  },
};
function setMode(m) {
  if (recording) return;
  mode = m; store.set("mode", m);
  $("modeConv").classList.toggle("on", m === "conversation");
  $("modeDict").classList.toggle("on", m === "dictation");
  $("recBox").hidden = m !== "conversation" && !recording;
  input.placeholder = MODE_TEXT[m].placeholder;
  $("inputHint").textContent = MODE_TEXT[m].hint;
}
// 前の内容が残っていたら、消してから新しく録音する(別の患者さんの内容と混ざらないように)
function beginRecordingFresh() {
  if (input.value.trim() || !$("result").hidden) {
    if (!confirm("前の内容を消して、新しく録音を始めます。よろしいですか?")) return;
    clearAll();
  }
  startRecording();
}
// ① は押したらすぐ録音
$("modeConv").onclick = () => { if (recording) return; setMode("conversation"); beginRecordingFresh(); };
// ② は1回でキーボード(🎤はキーボードで押す)、2回続けて押すとアプリで録音。
// キーボードは押した瞬間にしか開けないので、1回目で開き、2回目が来たら閉じて録音にする
let lastDictTap = 0;
$("modeDict").onclick = () => {
  if (recording) return;
  const now = Date.now();
  if (now - lastDictTap < 450) { lastDictTap = 0; input.blur(); setMode("dictation"); beginRecordingFresh(); return; }
  lastDictTap = now;
  setMode("dictation");
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
};

// ---- 録音(① 会話と、② を2回押したとき)。無音でも止まらない。1分ごとに区切って文字起こしに送る ----
const SEGMENT_MS = 60 * 1000;
let recording = false, stream = null, recorder = null, segTimer = null, clock = null, wakeLock = null, recStart = 0;
let queue = [], failed = [], sending = false, doneCount = 0, transcribeYen = 0, summarizeWhenDone = false;
// 止めるボタンのあと、最後の区切りが届いたか(iPhoneでは停止の知らせが少し遅れて来る)
let lastStopped = true;

function pickType() {
  for (const t of ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"]) if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  return "";
}
const mmss = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}`;
function recInfo(extra = "") {
  const parts = [];
  if (recording) parts.push(`● 録音中 ${mmss(Date.now() - recStart)}`);
  if (doneCount) parts.push(`文字にした区切り ${doneCount}本`);
  if (sending || queue.length || !lastStopped) parts.push(`文字起こし中…`);
  if (failed.length) parts.push(`失敗 ${failed.length}本`);
  $("recStatus").textContent = parts.join("・") + (extra ? "　" + extra : "");
}

async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch { wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { if (recording && document.visibilityState === "visible") keepAwake(); });

function startSegment() {
  const type = pickType();
  const r = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
  const parts = [];
  r.ondataavailable = (e) => { if (e.data && e.data.size) parts.push(e.data); };
  r.onstop = () => {
    // 止めるボタンで止めたときは、これが最後の区切り(1分ごとの区切りでは recording のまま)
    if (!recording) lastStopped = true;
    if (parts.length && !r.discard) { queue.push(new Blob(parts, { type: r.mimeType || type })); sendQueue(); } else { recInfo(); maybeSummarize(); }
  };
  r.start();
  recorder = r;
}

async function startRecording() {
  if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) { setStatus("この画面では録音できません。Safariのタブで開いてください", true); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch {
    setStatus("マイクを使えませんでした。マイクの使用を許可してください", true); return;
  }
  recording = true; recStart = Date.now(); summarizeWhenDone = false; lastStopped = false;
  $("recBox").hidden = false; $("cancelRec").hidden = false;
  $("recBtn").textContent = "■ 止めてまとめる"; $("recBtn").classList.add("on");
  $("run").disabled = true; setStatus("");
  startSegment();
  segTimer = setInterval(() => { recorder.stop(); startSegment(); }, SEGMENT_MS);
  clock = setInterval(() => recInfo(), 1000);
  keepAwake(); recInfo();
}

// summarize=false は「やめる」:最後の区切りは文字にせず、まとめもしない
function stopRecording(summarize = true) {
  clearInterval(segTimer); clearInterval(clock);
  recording = false; summarizeWhenDone = summarize;
  if (recorder) { recorder.discard = !summarize; recorder.stop(); } else lastStopped = true;
  stream?.getTracks().forEach((t) => t.stop());
  wakeLock?.release?.(); wakeLock = null;
  $("recBtn").textContent = "● 録音を始める"; $("recBtn").classList.remove("on");
  $("cancelRec").hidden = true; $("recBox").hidden = mode !== "conversation";
  // まとめるときは、最後の区切りまで文字になるまで「まとめる」を押せないようにする
  $("run").disabled = summarize;
  if (!summarize) setStatus("録音をやめました(この録音はまとめていません)");
  recInfo(); maybeSummarize();
}
$("recBtn").onclick = () => (recording ? stopRecording() : startRecording());
$("cancelRec").onclick = () => stopRecording(false);

// 区切りを順番に送る。失敗したらそこで止めて、順番が入れ替わらないようにする
async function sendQueue() {
  if (sending || failed.length) return;
  sending = true; recInfo();
  while (queue.length) {
    const blob = queue[0];
    let data = null, err = "";
    for (let i = 0; i < 3 && !data; i++) {
      try {
        const res = await fetch((settings.api || DEFAULT_API).replace(/\/$/, "") + "/api/transcribe", {
          method: "POST", headers: { "Content-Type": blob.type.split(";")[0], "X-Passphrase": settings.pass || "" }, body: blob,
        });
        const d = await res.json().catch(() => ({ error: `サーバーの応答を読めませんでした(${res.status})` }));
        if (!res.ok || d.error) { err = d.error || `エラー(${res.status})`; if (res.status < 500) break; }
        else data = d;
      } catch { err = "サーバーにつながりません"; }
      if (!data && i < 2) await new Promise((ok) => setTimeout(ok, 1500 * (i + 1)));
    }
    queue.shift();
    if (!data) { failed.push(blob, ...queue); queue = []; $("retryBtn").hidden = false; $("run").disabled = false; setStatus("文字起こしに失敗しました:" + err, true); break; }
    if (data.text) { input.value += (input.value && !input.value.endsWith("\n") ? "\n" : "") + data.text; $("count").textContent = input.value.length + "字"; saveLast(); }
    doneCount++; transcribeYen += data.yen || 0;
    if (data.usage) renderUsage(data.usage);
    recInfo();
  }
  sending = false; recInfo(); maybeSummarize();
}
$("retryBtn").onclick = () => { queue = failed.concat(queue); failed = []; $("retryBtn").hidden = true; setStatus(""); sendQueue(); };

// 録音を止めて、全部の区切りが文字になったら、そのまままとめる
function maybeSummarize() {
  if (summarizeWhenDone && lastStopped && !recording && !sending && !queue.length && !failed.length) {
    summarizeWhenDone = false; $("run").disabled = false;
    if (input.value.trim()) run(); else setStatus("会話が聞き取れませんでした", true);
  }
}

$("run").onclick = run;
$("again").onclick = run;
function clearAll() {
  input.value = ""; $("result").hidden = true; setStatus(""); $("count").textContent = "0字"; store.del("last");
  doneCount = 0; transcribeYen = 0; summaryRuns = []; runsText = ""; lastMeta = null; failed = []; $("retryBtn").hidden = true; recInfo();
}
$("clear").onclick = () => {
  if (recording) return;
  if ((input.value || !$("result").hidden) && !confirm("話した内容とまとめを消します。よろしいですか?")) return;
  clearAll();
};
setMode(mode);
loadUsage();
input.addEventListener("input", () => { $("count").textContent = input.value.length + "字"; saveLast(); });
for (const t of Object.values(boxes)) t.addEventListener("input", saveLast);
document.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => copy(getPlain(b.dataset.copy), b.dataset.copy));
$("copyAll").onclick = () => copy(KEYS.map((k) => `${k}:\n${getPlain(k)}`).join("\n"), "全部");

$("openSettings").onclick = () => { $("pass").value = settings.pass || ""; $("api").value = settings.api || ""; $("settings").showModal(); loadUsage(); };
$("closeSettings").onclick = () => $("settings").close();
$("saveSettings").onclick = () => { settings = { pass: $("pass").value, api: $("api").value.trim() }; store.set("settings", settings); $("settings").close(); toast("保存しました"); loadUsage(); };

// ---- 使った金額(全部の端末の合計。中継サーバーで数える) ----
const yenText = (v) => `約${v < 100 ? v.toFixed(1) : Math.round(v).toLocaleString()}円`;
const dateText = (iso) => { const d = new Date(iso); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; };
function renderUsage(u) {
  if (!u) { $("usageLine").hidden = true; $("usageDetail").textContent = "まだ記録がありません"; return; }
  const total = u.claudeYen + u.openaiYen;
  $("usageLine").hidden = false;
  $("usageLine").textContent = `これまでの合計 ${yenText(total)}(${dateText(u.since)}から)`;
  const min = Math.round(u.openaiSec / 60);
  $("usageDetail").innerHTML =
    `<div><span>まとめ(Claude)${u.claudeCount}回</span><span>${yenText(u.claudeYen)}</span></div>` +
    `<div><span>文字起こし(OpenAI)約${min}分</span><span>${yenText(u.openaiYen)}</span></div>` +
    `<div class="sum"><span>合計</span><span>${yenText(total)}</span></div>` +
    `<div class="note">${dateText(u.since)}から数えています(1ドル150円で計算した目安)</div>`;
}
async function usageApi(action) {
  const res = await fetch((settings.api || DEFAULT_API).replace(/\/$/, "") + "/api/usage", {
    method: "POST", headers: { "Content-Type": "application/json", "X-Passphrase": settings.pass || "" }, body: JSON.stringify({ action }),
  });
  const d = await res.json().catch(() => ({}));
  if (!res.ok || d.error) throw new Error(d.error || `エラー(${res.status})`);
  return d.usage;
}
async function loadUsage() { try { renderUsage(await usageApi("get")); } catch { /* 合言葉が未設定などのときは出さない */ } }
$("resetUsage").onclick = async () => {
  if (!confirm("使った金額の合計を0に戻します。すべての端末で0になります。よろしいですか?")) return;
  try { renderUsage(await usageApi("reset")); toast("合計をリセットしました"); } catch (e) { toast("リセットできませんでした:" + e.message); }
};

// 直前の1件を戻す
const last = store.get("last");
if (last) {
  input.value = last.input || ""; $("count").textContent = input.value.length + "字";
  summaryRuns = last.runs || []; runsText = last.runsText || ""; transcribeYen = last.stt || 0;
  if (last.sections) showResult(last.sections, last.meta);
}</script>
